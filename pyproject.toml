[project]
name = "llm-cost-autopilot"
version = "0.2.0"
description = "Multi-provider LLM router with per-call cost estimation"
readme = "README.md"
authors = [
    { name = "Jefferson", email = "jeffersonadda123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
llm-cost-autopilot = "app.main:start"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
